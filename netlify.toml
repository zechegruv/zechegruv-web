[build]
  publish = "ZECHE_GRUV_Web"
  functions = "netlify/functions"
  # En cada publicación, los estilos, el código y los idiomas del inicio se
  # piden con el número de esa versión (?v=…): el navegador los guarda un año
  # y, cuando hay cambios, baja los nuevos solo. En la compu queda "__BUILD__".
  # También las páginas de ZG PASS y de artistas (piden medicion.js así):
  # se buscan con find, así anda con cualquier cantidad de páginas.
  # Y el service worker del portal (portal/sw.js): con la versión nueva, el
  # celu se entera de que hay cambios y borra lo guardado de la anterior.
  command = "sed -i \"s/__BUILD__/${COMMIT_REF:-local}/g\" ZECHE_GRUV_Web/index.html ZECHE_GRUV_Web/portal/index.html ZECHE_GRUV_Web/portal/sw.js ZECHE_GRUV_Web/assets/js/site.js && find ZECHE_GRUV_Web/pass ZECHE_GRUV_Web/artistas -name '*.html' -exec sed -i \"s/__BUILD__/${COMMIT_REF:-local}/g\" {} +"

[functions]
  node_bundler = "esbuild"

# Entregas automáticas: cada 15 minutos revisa las carpetas de los artistas
# y, si subiste una mezcla o un master, la marca entregada en Notion, cierra
# su sesión y avisa al artista (netlify/functions/_lib/auto-entregas.js).
[functions."auto-entregas"]
  schedule = "*/15 * * * *"

# Estado de los lanzamientos en las tiendas (ZIL): cada hora, al minuto 23.
# Mantiene al artista al tanto y le avisa cuando ya está publicado
# (netlify/functions/zil-sync.js).
[functions."zil-sync"]
  schedule = "23 * * * *"

# Link corto para compartir: lleva a la venta de entradas de ZG PASS
# (si hay un solo evento a la venta, abre directo su compra).
[[redirects]]
  from = "/entradas"
  to = "/pass/"
  status = 302

# Inscripción al open mic, para quien ya compró: pide el mail de la compra
# (no hace falta tener a mano el link del mail ni de la orden).
[[redirects]]
  from = "/openmic"
  to = "/pass/openmic/"
  status = 302

# Pistas de un artista invitado a tocar (sin cuenta en el portal): link
# único que se arma desde el portal, ZG PASS → Carpetas. La clave (?k=…)
# pasa sola a la página.
[[redirects]]
  from = "/pistas"
  to = "/pass/pistas/"
  status = 302

# Link de "Invitá a un amigo" del portal: zechegruv.com/v/<artista> lleva
# al inicio marcado como recomendación de ese artista (Google Analytics lo
# cuenta como campaña).
[[redirects]]
  from = "/v/:artista"
  to = "/?utm_source=amigo&utm_medium=referido&utm_campaign=:artista"
  status = 302

# Acceso de puerta de un evento (scanner, venta en puerta y contador), con
# link único que arma el administrador en ZG PASS → "Acceso de puerta".
[[redirects]]
  from = "/puerta"
  to = "/pass/puerta/"
  status = 302

# Tipografías: el nombre lleva versión (-v1), así que el navegador las
# guarda un año sin volver a pedirlas. Si se cambia la fuente, subir a -v2.
[[headers]]
  for = "/assets/fonts/*.woff"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Service worker del portal (instalable y sin conexión): el navegador lo
# revisa siempre, así una versión nueva llega apenas se publica.
[[headers]]
  for = "/portal/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Estilos, código e idiomas del inicio: llevan ?v=<versión>, se guardan un año.
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/assets/i18n/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/assets/grain-v1.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fotos, portadas y videos: un día. Si se reemplaza una imagen con el mismo
# nombre, a más tardar al día siguiente todos ven la nueva.
[[headers]]
  for = "/assets/camps/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
[[headers]]
  for = "/assets/events/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
[[headers]]
  for = "/assets/covers/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
[[headers]]
  for = "/assets/studio/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
[[headers]]
  for = "/assets/hero/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
[[headers]]
  for = "/assets/og/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
[[headers]]
  for = "/assets/team/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
[[headers]]
  for = "/assets/mail/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
[[headers]]
  for = "/assets/favicon/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
[[headers]]
  for = "/assets/artists/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
