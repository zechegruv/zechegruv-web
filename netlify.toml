[build]
  publish = "ZECHE_GRUV_Web"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Link corto para compartir: lleva a la venta de entradas de ZG PASS
# (si hay un solo evento a la venta, abre directo su compra).
[[redirects]]
  from = "/entradas"
  to = "/pass/"
  status = 302

# Tipografías: el nombre lleva versión (-v1), así que el navegador las
# guarda un año sin volver a pedirlas. Si se cambia la fuente, subir a -v2.
[[headers]]
  for = "/assets/fonts/*.woff"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
