  <script type="application/json" id="bioData">{"es": "En palabras de Anita Pau sobre su canción \"Duelo\": \"Nació de una contradicción que vivo todo el tiempo: amar tanto lo que hago que a veces también duele. Duele la autoexigencia, los procesos, las dudas, el irse lejos de la familia para crecer, el cansancio mental, sentir que nunca es suficiente… pero aun así seguir. Porque cuando algo es realmente tuyo, incluso en los días más difíciles, no podés soltarlo. Esta canción es la representación de mi cabeza en esos momentos, de lo que siento cuando persigo mis sueños y el peso emocional que a veces viene con eso. Pero siempre te elijo, música.\"", "en": "In Anita Pau's words about her song \"Duelo\": \"It was born from a contradiction I live with all the time: loving what I do so much that sometimes it also hurts. The self-demand hurts, the processes, the doubts, going far from family to grow, the mental exhaustion, feeling like it's never enough… but still going on. Because when something is truly yours, even on the hardest days, you can't let it go. This song is the representation of my mind in those moments, of what I feel when I chase my dreams and the emotional weight that sometimes comes with that. But I always choose you, music.\"", "pt": "Nas palavras de Anita Pau sobre sua música \"Duelo\": \"Nasceu de uma contradição que eu vivo o tempo todo: amar tanto o que faço que às vezes também dói. Dói a autoexigência, os processos, as dúvidas, ir para longe da família para crescer, o cansaço mental, sentir que nunca é suficiente… mas mesmo assim continuar. Porque quando algo é realmente seu, mesmo nos dias mais difíceis, você não consegue soltar. Essa música é a representação da minha cabeça nesses momentos, do que eu sinto quando persigo meus sonhos e do peso emocional que às vezes vem junto com isso. Mas eu sempre te escolho, música.\"", "fr": "Dans les mots d'Anita Pau à propos de sa chanson « Duelo » : « Elle est née d'une contradiction que je vis tout le temps : aimer tellement ce que je fais qu'à certains moments, ça fait aussi mal. Ça fait mal, l'exigence envers moi-même, les processus, les doutes, le fait de s'éloigner de sa famille pour grandir, la fatigue mentale, le sentiment que ce n'est jamais assez… mais continuer quand même. Parce que quand quelque chose est vraiment à toi, même dans les jours les plus difficiles, tu ne peux pas le lâcher. Cette chanson est la représentation de ma tête dans ces moments-là, de ce que je ressens quand je poursuis mes rêves et du poids émotionnel qui vient parfois avec ça. Mais je te choisis toujours, musique. »", "it": "Con le parole di Anita Pau sulla sua canzone \"Duelo\": \"È nata da una contraddizione che vivo continuamente: amare talmente tanto quello che faccio che a volte fa anche male. Fa male l'autoesigenza, i processi, i dubbi, l'andare lontano dalla famiglia per crescere, la stanchezza mentale, sentire che non è mai abbastanza… ma continuare comunque. Perché quando qualcosa è davvero tuo, anche nei giorni più difficili, non riesci a lasciarlo andare. Questa canzone è la rappresentazione della mia testa in quei momenti, di ciò che provo quando inseguo i miei sogni e del peso emotivo che a volte porta con sé. Ma scelgo sempre te, musica.\"", "de": "In den Worten von Anita Pau über ihren Song \"Duelo\": \"Er entstand aus einem Widerspruch, den ich ständig erlebe: das, was ich tue, so sehr zu lieben, dass es manchmal auch wehtut. Es tut weh, der Selbstanspruch, die Prozesse, die Zweifel, sich von der Familie zu entfernen, um zu wachsen, die mentale Erschöpfung, das Gefühl, dass es nie genug ist… aber trotzdem weiterzumachen. Denn wenn etwas wirklich dir gehört, kannst du es selbst an den schwersten Tagen nicht loslassen. Dieser Song ist die Darstellung meines Kopfes in solchen Momenten, dessen, was ich fühle, wenn ich meinen Träumen nachjage, und der emotionalen Last, die manchmal damit einhergeht. Aber ich wähle immer dich, Musik.\"", "ru": "Слова Аниты Пау (Anita Pau) о своей песне «Duelo»: «Она родилась из противоречия, с которым я живу постоянно: так сильно любить то, что делаю, что порой это тоже причиняет боль. Больно от требовательности к себе, от процессов, от сомнений, от того, что приходится уезжать далеко от семьи, чтобы расти, от умственной усталости, от ощущения, что этого никогда не достаточно… но всё равно продолжать. Потому что когда что-то по-настоящему твоё, даже в самые тяжёлые дни, ты не можешь это отпустить. Эта песня — отражение того, что происходит у меня в голове в такие моменты, того, что я чувствую, когда гонюсь за своими мечтами, и эмоциональной тяжести, которая иногда приходит вместе с этим. Но я всегда выбираю тебя, музыка»."}</script>
