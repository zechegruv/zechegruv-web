  <script type="application/json" id="bioData">{"es": "Midel, nombre artístico de Alexis Gonzalo Vallejos, es un rapero y cantante argentino nacido en Béccar, Buenos Aires, el 21 de noviembre de 1996. Comenzó a rapear a los 13 años en batallas de freestyle, entre ellas las del influyente ciclo El Quinto Escalón. Su debut oficial en la escena del trap llegó en agosto de 2017 con el sencillo \"B.U.H.O\", una colaboración con Klave, Arse, Khea, Duki y Mykka que superó los 78 millones de reproducciones y lo posicionó dentro del movimiento del trap argentino en ascenso. En los años siguientes sumó colaboraciones con artistas como Seven Kayne y participó en temas junto a Khea y Duki, consolidándose como una de las voces reconocidas del género en el país.", "en": "Midel, stage name of Alexis Gonzalo Vallejos, is an Argentine rapper and singer born in Béccar, Buenos Aires, on November 21, 1996. He started rapping at age 13 in freestyle battles, including those of the influential circuit El Quinto Escalón. His official debut in the trap scene came in August 2017 with the single \"B.U.H.O\", a collaboration with Klave, Arse, Khea, Duki and Mykka that surpassed 78 million streams and placed him within the rising Argentine trap movement. In the following years he added collaborations with artists such as Seven Kayne and took part in tracks alongside Khea and Duki, establishing himself as one of the recognized voices of the genre in the country.", "pt": "Midel, nome artístico de Alexis Gonzalo Vallejos, é um rapper e cantor argentino nascido em Béccar, Buenos Aires, em 21 de novembro de 1996. Começou a rimar aos 13 anos em batalhas de freestyle, entre elas as do influente circuito El Quinto Escalón. Sua estreia oficial na cena do trap veio em agosto de 2017 com o single \"B.U.H.O\", uma colaboração com Klave, Arse, Khea, Duki e Mykka que ultrapassou 78 milhões de reproduções e o posicionou dentro do movimento ascendente do trap argentino. Nos anos seguintes somou colaborações com artistas como Seven Kayne e participou de faixas ao lado de Khea e Duki, consolidando-se como uma das vozes reconhecidas do gênero no país.", "fr": "Midel, nom de scène d'Alexis Gonzalo Vallejos, est un rappeur et chanteur argentin né à Béccar, Buenos Aires, le 21 novembre 1996. Il a commencé à rapper à 13 ans lors de battles de freestyle, notamment celles de l'influent circuit El Quinto Escalón. Ses débuts officiels dans la scène trap ont eu lieu en août 2017 avec le single « B.U.H.O », une collaboration avec Klave, Arse, Khea, Duki et Mykka qui a dépassé les 78 millions d'écoutes et l'a positionné au sein du mouvement montant du trap argentin. Les années suivantes, il a multiplié les collaborations avec des artistes comme Seven Kayne et a participé à des titres aux côtés de Khea et Duki, s'imposant comme l'une des voix reconnues du genre dans le pays.", "it": "Midel, nome d'arte di Alexis Gonzalo Vallejos, è un rapper e cantante argentino nato a Béccar, Buenos Aires, il 21 novembre 1996. Ha iniziato a fare rap a 13 anni nelle battle di freestyle, tra cui quelle dell'influente circuito El Quinto Escalón. Il suo debutto ufficiale nella scena trap è arrivato nell'agosto 2017 con il singolo \"B.U.H.O\", una collaborazione con Klave, Arse, Khea, Duki e Mykka che ha superato i 78 milioni di ascolti e lo ha posizionato all'interno del movimento emergente del trap argentino. Negli anni successivi ha aggiunto collaborazioni con artisti come Seven Kayne e ha partecipato a brani insieme a Khea e Duki, affermandosi come una delle voci riconosciute del genere nel paese.", "de": "Midel, Künstlername von Alexis Gonzalo Vallejos, ist ein argentinischer Rapper und Sänger, geboren am 21. November 1996 in Béccar, Buenos Aires. Er begann mit 13 Jahren in Freestyle-Battles zu rappen, unter anderem im einflussreichen Zirkel El Quinto Escalón. Sein offizielles Debüt in der Trap-Szene kam im August 2017 mit der Single \"B.U.H.O\", einer Zusammenarbeit mit Klave, Arse, Khea, Duki und Mykka, die über 78 Millionen Streams erreichte und ihn innerhalb der aufstrebenden argentinischen Trap-Bewegung positionierte. In den folgenden Jahren kamen Kollaborationen mit Künstlern wie Seven Kayne hinzu, und er wirkte an Tracks mit Khea und Duki mit, wodurch er sich als eine der anerkannten Stimmen des Genres im Land etablierte.", "ru": "Midel — сценическое имя Алексиса Гонсало Вальехоса (Alexis Gonzalo Vallejos), аргентинского рэпера и певца, родившегося в Бекаре (Béccar), Буэнос-Айрес, 21 ноября 1996 года. Он начал читать рэп в 13 лет на фристайл-баттлах, в том числе в рамках влиятельного цикла El Quinto Escalón. Его официальный дебют в трэп-сцене состоялся в августе 2017 года с синглом «B.U.H.O» — совместной работой с Klave, Arse, Khea, Duki и Mykka, который набрал более 78 миллионов прослушиваний и закрепил за ним место в набирающем силу аргентинском трэп-движении. В последующие годы он записывал совместные треки с такими артистами, как Seven Kayne, а также участвовал в песнях вместе с Khea и Duki, став одним из признанных голосов жанра в стране."}</script>
