ffentlichte er \"4:20\", das vierte Kapitel des Projekts, mit Kollaborationen von Midel und MP el Juvenil. Er ist innerhalb der argentinischen unabhängigen Szene dafür anerkannt, zur klanglichen und lyrischen Weiterentwicklung des lokalen Trap beizutragen, und hat Kollaborationen mit anderen aufstrebenden Künstlern der urbanen Musik wie Ekiss hinzugefügt.", "ru": "Borja Trece — аргентинский трэп-исполнитель из провинции Буэнос-Айрес, отличающийся стилем под влиянием детройтского трэпа и сильным концептуальным подходом к своим проектам. Он работает над альбомом, построенным по главам, под названием «Carta de Amor» («Любовное письмо»), задуманным как immersive-опыт, проходящий через разные этапы и эмоции отношений. В апреле 2025 года он выпустил «4:20» — четвёртую главу проекта, с участием Midel и MP el Juvenil. Он известен в аргентинской независимой сцене своим вкладом в звуковую и лирическую эволюцию местного трэпа, а также сотрудничал с другими начинающими артистами урбан-музыки, такими как Ekiss."}</script>
