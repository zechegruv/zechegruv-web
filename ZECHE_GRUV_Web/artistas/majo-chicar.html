  <script type="application/json" id="bioData">{"es": "Majo Chicar es cantante, compositora, productora y actriz. Con 28 años y un recorrido musical desde temprana edad, llega a la escena actual de la música porteña con un sonido propio que no deja de sorprender a su audiencia canción a canción. Porteña, oriunda de Villa Pueyrredón, con el oído atravesado por una Argentina de norte a sur, con influencias nacionales como la locura de Charly García, la naturaleza cósmica de Björk y la mesura del flamenco de Rosalía. A los 16 años, de manera autodidacta, se sumergió en la producción musical, descubriendo en este ámbito el canal perfecto para desplegar su potencial creativo y fusionar sus diversas formas de expresión. Se destaca como una artista versátil, con creatividad, destreza con los instrumentos, habilidades actorales y expresión corporal, elementos que nunca faltan en cada una de sus obras.", "en": "Majo Chicar is a singer, songwriter, producer and actress. At 28 years old, with a musical journey that began at an early age, she arrives on the current Buenos Aires music scene with a sound of her own that keeps surprising her audience song after song. A native of Buenos Aires, from the Villa Pueyrredón neighborhood, with an ear shaped by an Argentina stretching from north to south, and with national influences such as the madness of Charly García, the cosmic nature of Björk and the restraint of Rosalía's flamenco. At 16, self-taught, she immersed herself in music production, finding in that field the perfect channel to unfold her creative potential and fuse her different forms of expression. She stands out as a versatile artist, with creativity, instrumental skill, acting ability and body expression — elements that are never missing from any of her works.", "pt": "Majo Chicar é cantora, compositora, produtora e atriz. Aos 28 anos, com uma trajetória musical desde cedo, chega à cena atual da música portenha com um som próprio que não para de surpreender seu público canção a canção. Portenha, natural de Villa Pueyrredón, com o ouvido atravessado por uma Argentina de norte a sul, com influências nacionais como a loucura de Charly García, a natureza cósmica de Björk e a contenção do flamenco de Rosalía. Aos 16 anos, de forma autodidata, mergulhou na produção musical, descobrindo nesse campo o canal perfeito para desdobrar seu potencial criativo e fundir suas diversas formas de expressão. Destaca-se como uma artista versátil, com criatividade, destreza com instrumentos, habilidades atorais e expressão corporal, elementos que nunca faltam em nenhuma de suas obras.", "fr": "Majo Chicar est chanteuse, compositrice, productrice et actrice. À 28 ans, avec un parcours musical débuté dès son plus jeune âge, elle arrive sur la scène musicale actuelle de Buenos Aires avec un son bien à elle qui ne cesse de surprendre son public chanson après chanson. Originaire de Buenos Aires, du quartier de Villa Pueyrredón, avec une oreille façonnée par une Argentine du nord au sud, et des influences nationales comme la folie de Charly García, la nature cosmique de Björk et la retenue du flamenco de Rosalía. À 16 ans, en autodidacte, elle s'est plongée dans la production musicale, y découvrant le canal parfait pour déployer son potentiel créatif et fusionner ses différentes formes d'expression. Elle se distingue comme une artiste polyvalente, avec créativité, maîtrise des instruments, talent d'actrice et expression corporelle, des éléments qui ne manquent jamais dans aucune de ses œuvres.", "it": "Majo Chicar è cantante, compositrice, produttrice e attrice. A 28 anni, con un percorso musicale iniziato fin da piccola, arriva sulla scena musicale attuale di Buenos Aires con un suono proprio che continua a sorprendere il suo pubblico canzone dopo canzone. Originaria di Buenos Aires, del quartiere di Villa Pueyrredón, con un orecchio attraversato da un'Argentina da nord a sud, con influenze nazionali come la follia di Charly García, la natura cosmica di Björk e la misura del flamenco di Rosalía. A 16 anni, in modo autodidatta, si è immersa nella produzione musicale, scoprendo in questo ambito il canale perfetto per dispiegare il proprio potenziale creativo e fondere le sue diverse forme di espressione. Si distingue come un'artista versatile, con creatività, abilità con gli strumenti, capacità recitative ed espressione corporea, elementi che non mancano mai in nessuna delle sue opere.", "de": "Majo Chicar ist Sängerin, Songwriterin, Produzentin und Schauspielerin. Mit 28 Jahren und einem musikalischen Werdegang, der schon früh begann, betritt sie die aktuelle Musikszene von Buenos Aires mit einem eigenen Sound, der ihr Publikum Song für Song immer wieder überrascht. Gebürtig aus Buenos Aires, aus dem Stadtteil Villa Pueyrredón, mit einem Ohr, geprägt von einem Argentinien von Nord bis Süd, mit nationalen Einflüssen wie dem Wahnsinn von Charly García, der kosmischen Natur von Björk und der Zurückhaltung des Flamenco von Rosalía. Mit 16 Jahren tauchte sie autodidaktisch in die Musikproduktion ein und entdeckte darin den perfekten Kanal, um ihr kreatives Potenzial zu entfalten und ihre verschiedenen Ausdrucksformen zu verschmelzen. Sie zeichnet sich als vielseitige Künstlerin aus, mit Kreativität, Geschick an Instrumenten, schauspielerischem Talent und Körperausdruck — Elemente, die in keinem ihrer Werke fehlen.", "ru": "Майо Чикар (Majo Chicar) — певица, автор песен, продюсер и актриса. В 28 лет, с музыкальным путём, начавшимся ещё в раннем возрасте, она выходит на современную музыкальную сцену Буэнос-Айреса с собственным звучанием, которое продолжает удивлять публику от песни к песне. Уроженка Буэнос-Айреса, из района Вилья-Пуэйрредон (Villa Pueyrredón), с слухом, сформированным Аргентиной от севера до юга, с национальными влияниями, такими как безумие Чарли Гарсиа (Charly García), космическая природа Бьорк (Björk) и сдержанность фламенко Росалии (Rosalía). В 16 лет, будучи самоучкой, она погрузилась в музыкальное продюсирование, найдя в этой сфере идеальный канал для раскрытия своего творческого потенциала и слияния разных форм самовыражения. Она выделяется как разносторонняя артистка — с творческим началом, мастерским владением инструментами, актёрскими способностями и телесной выразительностью, элементами, которые неизменно присутствуют в каждой её работе."}</script>
