ken. In seinem Viertel wird er gehört und respektiert für seine Wahrhaftigkeit und seine Sicht auf die Realität der Favela — wie er in seinem Text sagt: \"Ich bin aus der Favela raus, aber sie ist nie aus mir raus\", was zeigt, wie sehr er seiner Herkunft und seinem Wesen für sein Viertel treu bleibt.", "ru": "«Anrry» — трэп- и фанк-исполнитель из Дуки-ди-Кашиас (Duque de Caxias). Молодой артист выделяется текстами своих песен, привлекая внимание публики тем, что описывает свою повседневную жизнь. Он уже записывался с крупной иконой фанка Kevin o Chris, а также с другими именами сцены. Обещает представить новинки в этом году, оставаясь независимым артистом. Его трек «Freestyle» набрал более 600 тысяч просмотров в соцсетях. В своём районе его слушают и уважают за его правду и его взгляд на реальность фавелы — как он говорит в своём тексте: «я вышел из фавелы, но она никогда не выходила из меня», показывая, насколько он сохраняет верность своим корням и своей сути ради своего района."}</script>
