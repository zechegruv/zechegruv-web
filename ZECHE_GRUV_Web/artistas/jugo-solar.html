  <script type="application/json" id="bioData">{"es": "Jugo Solar es la nueva promesa del trap argentino. Es un artista urbano que mezcla lo crudo con lo emocional en una propuesta sonora única. Su música nace de la ansiedad, la bronca y el sobrepensamiento, transformando esa energía en canciones que atraviesan. Compone toda su música y encuentra su identidad en la fusión de géneros urbanos actuales con el legado del rock nacional, desde los años 60 hasta los 2000. Entre sus influencias destacan Luis Alberto Spinetta, Charly García, Gustavo Cerati y Fito Páez. Participó en Sangre Joven y se presentó en el Buenos Aires Trap 2024, dejando huella como una de las voces más intensas y personales de la nueva escena argentina. Su proyecto es visceral, honesto y profundamente argentino: un puente entre el pasado dorado del rock y la crudeza del presente urbano."}</script>
