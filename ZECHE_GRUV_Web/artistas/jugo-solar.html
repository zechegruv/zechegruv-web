  <script type="application/json" id="bioData">{"es": "Jugo Solar es la nueva promesa del trap argentino. Es un artista urbano que mezcla lo crudo con lo emocional en una propuesta sonora única. Su música nace de la ansiedad, la bronca y el sobrepensamiento, transformando esa energía en canciones que atraviesan. Compone toda su música y encuentra su identidad en la fusión de géneros urbanos actuales con el legado del rock nacional, desde los años 60 hasta los 2000. Entre sus influencias destacan Luis Alberto Spinetta, Charly García, Gustavo Cerati y Fito Páez. Participó en Sangre Joven y se presentó en el Buenos Aires Trap 2024, dejando huella como una de las voces más intensas y personales de la nueva escena argentina. Su proyecto es visceral, honesto y profundamente argentino: un puente entre el pasado dorado del rock y la crudeza del presente urbano.", "en": "Jugo Solar is the new promise of Argentine trap. He's an urban artist who blends the raw with the emotional in a unique sonic proposal. His music is born from anxiety, anger and overthinking, turning that energy into songs that hit deep. He writes all his own music and finds his identity in the fusion of today's urban genres with the legacy of Argentine rock, from the 1960s through the 2000s. His influences include Luis Alberto Spinetta, Charly García, Gustavo Cerati and Fito Páez. He took part in Sangre Joven and performed at Buenos Aires Trap 2024, leaving his mark as one of the most intense and personal voices of the new Argentine scene. His project is visceral, honest and profoundly Argentine: a bridge between rock's golden past and the rawness of the urban present.", "pt": "Jugo Solar é a nova promessa do trap argentino. É um artista urbano que mistura o cru com o emocional em uma proposta sonora única. Sua música nasce da ansiedade, da raiva e do excesso de pensamento, transformando essa energia em canções que atravessam quem ouve. Compõe toda a sua música e encontra sua identidade na fusão dos gêneros urbanos atuais com o legado do rock nacional argentino, dos anos 60 até os anos 2000. Entre suas influências se destacam Luis Alberto Spinetta, Charly García, Gustavo Cerati e Fito Páez. Participou do Sangre Joven e se apresentou no Buenos Aires Trap 2024, deixando sua marca como uma das vozes mais intensas e pessoais da nova cena argentina. Seu projeto é visceral, honesto e profundamente argentino: uma ponte entre o passado dourado do rock e a crueza do presente urbano.", "fr": "Jugo Solar est la nouvelle promesse du trap argentin. C'est un artiste urbain qui mêle le brut et l'émotionnel dans une proposition sonore unique. Sa musique naît de l'anxiété, de la colère et de la surréflexion, transformant cette énergie en chansons qui marquent. Il compose toute sa musique et trouve son identité dans la fusion des genres urbains actuels avec l'héritage du rock national argentin, des années 60 aux années 2000. Parmi ses influences se distinguent Luis Alberto Spinetta, Charly García, Gustavo Cerati et Fito Páez. Il a participé à Sangre Joven et s'est produit au Buenos Aires Trap 2024, laissant son empreinte comme l'une des voix les plus intenses et personnelles de la nouvelle scène argentine. Son projet est viscéral, honnête et profondément argentin : un pont entre le passé doré du rock et la crudité du présent urbain.", "it": "Jugo Solar è la nuova promessa del trap argentino. È un artista urbano che unisce il crudo e l'emotivo in una proposta sonora unica. La sua musica nasce dall'ansia, dalla rabbia e dal pensiero eccessivo, trasformando quell'energia in canzoni che colpiscono. Compone tutta la sua musica e trova la propria identità nella fusione dei generi urbani attuali con l'eredità del rock nazionale argentino, dagli anni '60 fino ai 2000. Tra le sue influenze spiccano Luis Alberto Spinetta, Charly García, Gustavo Cerati e Fito Páez. Ha partecipato a Sangre Joven e si è esibito al Buenos Aires Trap 2024, lasciando il segno come una delle voci più intense e personali della nuova scena argentina. Il suo progetto è viscerale, onesto e profondamente argentino: un ponte tra il passato dorato del rock e la crudezza del presente urbano.", "de": "Jugo Solar ist das neue Versprechen des argentinischen Trap. Er ist ein Urban-Künstler, der das Rohe mit dem Emotionalen in einem einzigartigen klanglichen Angebot verbindet. Seine Musik entsteht aus Angst, Wut und Grübelei und verwandelt diese Energie in Songs, die tief treffen. Er schreibt seine gesamte Musik selbst und findet seine Identität in der Verschmelzung der heutigen Urban-Genres mit dem Erbe des argentinischen Nationalrocks, von den 1960ern bis in die 2000er. Zu seinen Einflüssen zählen Luis Alberto Spinetta, Charly García, Gustavo Cerati und Fito Páez. Er wirkte bei Sangre Joven mit und trat beim Buenos Aires Trap 2024 auf, wo er sich als eine der intensivsten und persönlichsten Stimmen der neuen argentinischen Szene einen Namen machte. Sein Projekt ist viszeral, ehrlich und zutiefst argentinisch: eine Brücke zwischen der goldenen Vergangenheit des Rock und der Rohheit der urbanen Gegenwart.", "ru": "Jugo Solar — новая надежда аргентинского трэпа. Это урбан-артист, сочетающий сырую энергию с эмоциональностью в уникальном звуковом предложении. Его музыка рождается из тревоги, злости и чрезмерных раздумий, превращая эту энергию в песни, которые пробирают до глубины. Он сам сочиняет всю свою музыку и находит свою идентичность в слиянии современных урбан-жанров с наследием аргентинского национального рока — от 60-х до 2000-х годов. Среди его влияний выделяются Луис Альберто Спинетта (Luis Alberto Spinetta), Чарли Гарсиа (Charly García), Густаво Серати (Gustavo Cerati) и Фито Паэс (Fito Páez). Он принял участие в Sangre Joven и выступил на Buenos Aires Trap 2024, оставив след как один из самых сильных и личных голосов новой аргентинской сцены. Его проект — исступлённый, честный и глубоко аргентинский: мост между золотым прошлым рока и суровостью урбан-настоящего."}</script>
