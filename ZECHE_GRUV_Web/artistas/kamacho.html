  <script type="application/json" id="bioData">{"es": "Hace bastante que ando haciendo música. Podría usar este espacio para tirar esa típica carta de presentación que le encanta sacar a todo artista que empieza a sumar números en sus bios, pero no, no va por ahí, ¿no? Estoy ENAMORADO de la música y está presente en mi vida las 24 horas del día — eso ya se volvió una rutina hace tiempo. Soy una mezcla de todos los grandes artistas que pasaron por mi escuela musical, y créanme, fueron muchos. El resumen de todo eso lo encontrás en los temas. ¿Querés conocerme mejor? Seguime en las redes, dale.", "en": "I've been making music for a good while now. I could use this space to do that whole flex that every artist who starts putting up some numbers loves to do in their bio, but nah, that's not really it, right? I'm IN LOVE with music and it's part of my life 24 hours a day — that's been my routine for a long time now. I'm a mix of all the great artists that came through my music school, and believe me, there were a lot of them. The summary of all that, you'll find it in the tracks. Wanna get to know me better? Follow me on socials, go on.", "pt": "Já faz um bom tempo que eu faço umas músicas. Eu poderia usar esse espaço pra dar aquela bela carteirada que todo artista que começa a converter uns números adora dar em qualquer bio, mas nada a ver, né? Sou APAIXONADO pela música e ela está presente na minha vida 24 horas por dia — isso se tornou uma rotina há muito tempo. Sou uma mistura de todos os grandes artistas que participaram da minha escola musical, e acreditem, foram muitos. O resumo de tudo isso você confere nas faixas. Para me conhecer melhor? Me acompanha nas redes sociais aí, pô.", "fr": "Ça fait déjà un bon moment que je fais de la musique. Je pourrais utiliser cet espace pour sortir le classique numéro que tout artiste qui commence à faire des chiffres adore faire dans sa bio, mais bon, c'est pas trop mon truc, tu vois ? Je suis AMOUREUX de la musique et elle fait partie de ma vie 24 heures sur 24 — c'est devenu une routine depuis un bon moment. Je suis un mélange de tous les grands artistes qui sont passés par mon école de musique, et croyez-moi, y en a eu pas mal. Le résumé de tout ça, tu le trouves dans les morceaux. Envie de mieux me connaître ? Suis-moi sur les réseaux, quoi.", "it": "È da un bel po' che faccio musica. Potrei usare questo spazio per fare quella solita sviolinata che ogni artista che comincia a fare numeri adora fare nella sua bio, ma dai, non è proprio il mio stile, no? Sono INNAMORATO della musica ed è presente nella mia vita 24 ore su 24 — ormai è diventata una routine da un bel po'. Sono un mix di tutti i grandi artisti che sono passati dalla mia scuola di musica, e credetemi, sono stati tanti. Il riassunto di tutto questo lo trovate nei brani. Per conoscermi meglio? Seguitemi sui social, dai.", "de": "Ich mache schon eine ganze Weile Musik. Ich könnte diesen Platz nutzen, um mit der ganzen Angeberei loszulegen, die jeder Künstler, der anfängt, ein paar Zahlen zu machen, gerne in seiner Bio abzieht, aber nee, darum geht's nicht, oder? Ich bin VERLIEBT in die Musik, und sie ist 24 Stunden am Tag Teil meines Lebens — das ist schon seit Langem meine Routine. Ich bin eine Mischung aus all den großen Künstlern, die durch meine musikalische Schule gegangen sind, und glaubt mir, das waren einige. Die Zusammenfassung von alldem findet ihr in den Tracks. Wollt ihr mich besser kennenlernen? Folgt mir einfach in den sozialen Netzwerken.", "ru": "Я уже довольно давно делаю музыку. Мог бы использовать это место, чтобы толкнуть ту самую понтовую речь, которую обожает выдавать в своей био каждый артист, который начинает набирать цифры, но не, это не про меня, верно? Я ВЛЮБЛЁН в музыку, и она присутствует в моей жизни 24 часа в сутки — это уже давно стало моей рутиной. Я смесь всех крутых артистов, которые прошли через мою музыкальную школу, и поверьте, их было немало. Итог всего этого вы найдёте в треках. Хотите узнать меня получше? Подписывайтесь на меня в соцсетях, короче."}</script>
