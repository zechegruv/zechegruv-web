  <script type="application/json" id="bioData">{"es": "BR1 es un artista argentino criado entre Buenos Aires y Detroit, Michigan — dos ciudades, dos idiomas, un sonido que nunca terminó de pertenecer del todo a ninguno de los dos. Su música vive de noche. R&B oscuro, trap melódico, texturas experimentales que se mueven entre el inglés y el español como lo hace una conversación cuando las palabras de un idioma no alcanzan. Íntima, cinematográfica, sin apuro. Música para quien alguna vez tuvo que elegir entre el mundo y sí mismo… y finalmente se eligió a sí mismo.", "en": "BR1 is an Argentine artist raised between Buenos Aires and Detroit, Michigan — two cities, two languages, one sound that never fully belonged to either. His music lives at night. Dark R&B, melodic trap, experimental textures that move between English and Spanish the way a conversation does when words in one language aren't enough. Intimate, cinematic, unhurried. Music for anyone who has ever had to choose between the world and themselves … and finally chose themselves.", "pt": "BR1 é um artista argentino criado entre Buenos Aires e Detroit, Michigan — duas cidades, dois idiomas, um som que nunca chegou a pertencer totalmente a nenhum dos dois. Sua música vive à noite. R&B sombrio, trap melódico, texturas experimentais que transitam entre o inglês e o espanhol como faz uma conversa quando as palavras de um idioma não bastam. Íntima, cinematográfica, sem pressa. Música para quem já teve que escolher entre o mundo e si mesmo… e por fim escolheu a si mesmo.", "fr": "BR1 est un artiste argentin élevé entre Buenos Aires et Detroit, Michigan — deux villes, deux langues, un son qui n'a jamais vraiment appartenu à l'une ou à l'autre. Sa musique vit la nuit. R&B sombre, trap mélodique, textures expérimentales qui naviguent entre l'anglais et l'espagnol comme le fait une conversation quand les mots d'une langue ne suffisent plus. Intime, cinématographique, sans hâte. Une musique pour quiconque a un jour dû choisir entre le monde et soi-même… et a fini par se choisir soi-même.", "it": "BR1 è un artista argentino cresciuto tra Buenos Aires e Detroit, Michigan — due città, due lingue, un suono che non è mai appartenuto del tutto a nessuna delle due. La sua musica vive di notte. R&B oscuro, trap melodico, texture sperimentali che si muovono tra inglese e spagnolo come fa una conversazione quando le parole di una lingua non bastano più. Intima, cinematografica, senza fretta. Musica per chiunque abbia mai dovuto scegliere tra il mondo e se stesso… e alla fine abbia scelto se stesso.", "de": "BR1 ist ein argentinischer Künstler, aufgewachsen zwischen Buenos Aires und Detroit, Michigan — zwei Städte, zwei Sprachen, ein Sound, der nie ganz zu einer von beiden gehörte. Seine Musik lebt in der Nacht. Dunkler R&B, melodischer Trap, experimentelle Texturen, die zwischen Englisch und Spanisch wechseln, so wie es ein Gespräch tut, wenn die Worte einer Sprache nicht mehr ausreichen. Intim, kinoreif, ohne Eile. Musik für jeden, der jemals zwischen der Welt und sich selbst wählen musste … und sich am Ende für sich selbst entschied.", "ru": "BR1 — аргентинский артист, выросший между Буэнос-Айресом и Детройтом (штат Мичиган) — два города, два языка, звук, который так и не стал целиком принадлежать ни одному из них. Его музыка живёт ночью. Мрачный R&B, мелодичный трэп, экспериментальные текстуры, переходящие между английским и испанским так же, как это происходит в разговоре, когда слов одного языка не хватает. Интимная, кинематографичная, неторопливая. Музыка для каждого, кому доводилось выбирать между миром и самим собой… и кто в итоге выбрал себя."}</script>
