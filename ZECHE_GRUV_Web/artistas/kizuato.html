  <script type="application/json" id="bioData">{"es": "Kizuato transforma la emoción en paisaje sonoro. Nacido en Juazeiro-BA, creció entre el rock, la MPB y los primeros acordes en el piano y la guitarra, hasta encontrar en el hip hop el espacio para darle forma a sus propias vivencias. Artista independiente desde el inicio, construyó su estética a partir de la escasez: un celular, silencio y la urgencia de decir. Ese proceso dio origen a una sonoridad íntima, cruda y melódica, donde cada canción funciona como un fragmento de memoria. Movido por una entrega radical a los sentimientos, escribe sobre amor, romance y desilusiones con delicadeza e intensidad, transformando afectos en narrativa. Su música habita el territorio entre la vulnerabilidad y la belleza de sentir — un registro honesto de quien elige vivir el corazón por completo.", "en": "Kizuato turns emotion into sonic landscape. Born in Juazeiro-BA, he grew up amid rock, MPB and his first chords on piano and guitar, until he found in hip hop the space to give shape to his own experiences. An independent artist from the start, he built his aesthetic out of scarcity: a cellphone, silence and the urgency to speak. That process gave rise to an intimate, raw and melodic sound, where each track works as a fragment of memory. Driven by a radical surrender to feeling, he writes about love, romance and disillusion with delicacy and intensity, turning emotions into narrative. His music inhabits the territory between vulnerability and the beauty of feeling — an honest record of someone who chooses to live with his heart wide open.", "pt": "Kizuato transforma emoção em paisagem sonora. Nascido em Juazeiro-BA, cresceu entre o rock, a MPB e os primeiros acordes no piano e violão, até encontrar no hip hop o espaço para dar forma às próprias vivências. Artista independente desde o início, construiu sua estética a partir da escassez: um celular, silêncio e a urgência de dizer. Esse processo deu origem a uma sonoridade íntima, crua e melódica, onde cada faixa funciona como um fragmento de memória. Movido por uma entrega radical aos sentimentos, escreve sobre amor, romance e desilusões com delicadeza e intensidade, transformando afetos em narrativa. Sua música habita o território entre a vulnerabilidade e a beleza de sentir — um registro honesto de quem escolhe viver o coração por inteiro.", "fr": "Kizuato transforme l'émotion en paysage sonore. Né à Juazeiro-BA, il a grandi entre le rock, la MPB et ses premiers accords au piano et à la guitare, jusqu'à trouver dans le hip hop l'espace pour donner forme à ses propres expériences. Artiste indépendant depuis le début, il a construit son esthétique à partir du dénuement : un téléphone portable, le silence et l'urgence de dire. Ce processus a donné naissance à une sonorité intime, brute et mélodique, où chaque morceau fonctionne comme un fragment de mémoire. Animé par un abandon radical aux sentiments, il écrit sur l'amour, les histoires de cœur et les désillusions avec délicatesse et intensité, transformant les affects en récit. Sa musique habite le territoire entre la vulnérabilité et la beauté de ressentir — un témoignage honnête de celui qui choisit de vivre le cœur pleinement ouvert.", "it": "Kizuato trasforma l'emozione in paesaggio sonoro. Nato a Juazeiro-BA, è cresciuto tra il rock, la MPB e i primi accordi al pianoforte e alla chitarra, fino a trovare nell'hip hop lo spazio per dare forma alle proprie esperienze. Artista indipendente fin dall'inizio, ha costruito la sua estetica a partire dalla scarsità: un cellulare, il silenzio e l'urgenza di dire. Questo processo ha dato origine a una sonorità intima, grezza e melodica, in cui ogni brano funziona come un frammento di memoria. Mosso da un abbandono radicale ai sentimenti, scrive di amore, storie sentimentali e disillusioni con delicatezza e intensità, trasformando gli affetti in narrazione. La sua musica abita il territorio tra la vulnerabilità e la bellezza del sentire — una testimonianza onesta di chi sceglie di vivere il cuore per intero.", "de": "Kizuato verwandelt Emotion in Klanglandschaft. Geboren in Juazeiro-BA, wuchs er zwischen Rock, MPB und seinen ersten Akkorden auf Klavier und Gitarre auf, bis er im Hip-Hop den Raum fand, seinen eigenen Erfahrungen eine Form zu geben. Von Anfang an ein unabhängiger Künstler, baute er seine Ästhetik aus dem Mangel heraus auf: ein Handy, Stille und die Dringlichkeit, etwas zu sagen. Dieser Prozess brachte einen intimen, rohen und melodischen Sound hervor, bei dem jeder Track als Erinnerungsfragment funktioniert. Getrieben von einer radikalen Hingabe an das Gefühl, schreibt er mit Zartheit und Intensität über Liebe, Romantik und Enttäuschungen und verwandelt Gefühle in Erzählung. Seine Musik bewohnt das Gebiet zwischen Verletzlichkeit und der Schönheit des Fühlens — ein ehrliches Zeugnis von jemandem, der sich entscheidet, mit ganzem Herzen zu leben.", "ru": "Kizuato превращает эмоцию в звуковой пейзаж. Родившись в Жуазейру (штат Баия), он рос среди рока, MPB (бразильской популярной музыки) и первых аккордов на фортепиано и гитаре, пока не нашёл в хип-хопе пространство, чтобы облечь в форму собственный опыт. Независимый артист с самого начала, он выстроил свою эстетику из скудости средств: телефон, тишина и настоятельная потребность высказаться. Этот процесс породил интимное, сырое и мелодичное звучание, где каждый трек работает как фрагмент памяти. Движимый радикальной открытостью чувствам, он пишет о любви, романтике и разочарованиях с нежностью и интенсивностью, превращая переживания в повествование. Его музыка обитает на территории между уязвимостью и красотой чувствовать — честное свидетельство того, кто выбирает жить с открытым настежь сердцем."}</script>
