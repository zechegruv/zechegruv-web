  <script type="application/json" id="bioData">{"es": "Ekiss (@ekiss999) es un artista emergente de género urbano oriundo de la provincia de San Juan, Argentina. Desde pequeño estuvo muy cerca de la música, influenciado por su familia, lo que lo llevó a temprana edad a componer sus propias canciones desde su habitación. A pocos meses de su primer lanzamiento, con tan solo 15 años, dio su show debut teloneando a Lucho SSJ en la reconocida Fiesta Calor. A día de hoy, su show más grande fue la Fiesta Del Sol 2024, donde compartió escenario con Airbag y Trueno frente a 30.000 personas con tan solo 17 años. Cautivó a mucho público de su provincia presentándose en eventos como la Fiesta De Santa Lucía y la Fiesta De La Cerveza, e incluso en Buenos Aires con dos fechas en Local Support. Tiempo después de su primer lanzamiento, presentó \"ÉXTASIS\", una canción con influencias del pop, EDM, D&B y trap, con un videoclip que alcanzó las 50 mil reproducciones en YouTube en poco tiempo — estrenado en su primer show como headliner, donde se convirtió en el primer artista de género urbano de San Juan en tocar acompañado de una banda, mezclando géneros con el rock. Desde entonces sigue lanzando canciones, manteniendo un alto estándar de producción musical y visual, con el objetivo de hacer crecer su comunidad."}</script>
