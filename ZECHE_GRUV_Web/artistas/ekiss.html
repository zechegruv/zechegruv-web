  <script type="application/json" id="bioData">{"es": "Ekiss (@ekiss999) es un artista emergente de género urbano oriundo de la provincia de San Juan, Argentina. Desde pequeño estuvo muy cerca de la música, influenciado por su familia, lo que lo llevó a temprana edad a componer sus propias canciones desde su habitación. A pocos meses de su primer lanzamiento, con tan solo 15 años, dio su show debut teloneando a Lucho SSJ en la reconocida Fiesta Calor. A día de hoy, su show más grande fue la Fiesta Del Sol 2024, donde compartió escenario con Airbag y Trueno frente a 30.000 personas con tan solo 17 años. Cautivó a mucho público de su provincia presentándose en eventos como la Fiesta De Santa Lucía y la Fiesta De La Cerveza, e incluso en Buenos Aires con dos fechas en Local Support. Tiempo después de su primer lanzamiento, presentó \"ÉXTASIS\", una canción con influencias del pop, EDM, D&B y trap, con un videoclip que alcanzó las 50 mil reproducciones en YouTube en poco tiempo — estrenado en su primer show como headliner, donde se convirtió en el primer artista de género urbano de San Juan en tocar acompañado de una banda, mezclando géneros con el rock. Desde entonces sigue lanzando canciones, manteniendo un alto estándar de producción musical y visual, con el objetivo de hacer crecer su comunidad.", "en": "Ekiss (@ekiss999) is an emerging urban music artist from the province of San Juan, Argentina. From a young age he was very close to music, influenced by his family, which led him at an early age to write his own songs from his bedroom. Just a few months after his first release, at only 15 years old, he gave his debut show opening for Lucho SSJ at the well-known Fiesta Calor. To date, his biggest show was Fiesta Del Sol 2024, where he shared the stage with Airbag and Trueno in front of 30,000 people at just 17 years old. He won over a large audience in his home province, performing at events such as Fiesta De Santa Lucía and Fiesta De La Cerveza, and even in Buenos Aires with two dates at Local Support. Some time after his first release, he presented \"ÉXTASIS\", a song with influences of pop, EDM, D&B and trap, with a music video that reached 50 thousand views on YouTube in a short time — premiered at his first headline show, where he became the first urban music artist from San Juan to perform with a live band, blending genres with rock. Since then he has kept releasing songs, maintaining a high standard of musical and visual production, with the goal of growing his community.", "pt": "Ekiss (@ekiss999) é um artista emergente de música urbana, natural da província de San Juan, Argentina. Desde pequeno esteve muito próximo da música, influenciado por sua família, o que o levou, ainda cedo, a compor suas próprias canções no quarto. Poucos meses após seu primeiro lançamento, com apenas 15 anos, fez seu show de estreia abrindo para Lucho SSJ na conhecida Fiesta Calor. Até hoje, seu maior show foi a Fiesta Del Sol 2024, onde dividiu o palco com Airbag e Trueno diante de 30 mil pessoas com apenas 17 anos. Conquistou grande parte do público de sua província se apresentando em eventos como a Fiesta De Santa Lucía e a Fiesta De La Cerveza, e até em Buenos Aires com duas datas no Local Support. Um tempo depois de seu primeiro lançamento, apresentou \"ÉXTASIS\", uma música com influências de pop, EDM, D&B e trap, com um videoclipe que alcançou 50 mil visualizações no YouTube em pouco tempo — estreado em seu primeiro show como headliner, quando se tornou o primeiro artista de música urbana de San Juan a se apresentar acompanhado de uma banda, misturando gêneros com o rock. Desde então segue lançando músicas, mantendo um alto padrão de produção musical e visual, com o objetivo de fazer crescer sua comunidade.", "fr": "Ekiss (@ekiss999) est un artiste émergent de musique urbaine originaire de la province de San Juan, en Argentine. Dès son plus jeune âge, il a été très proche de la musique, influencé par sa famille, ce qui l'a conduit très tôt à composer ses propres chansons depuis sa chambre. Quelques mois seulement après sa première sortie, à seulement 15 ans, il a donné son concert de débuts en première partie de Lucho SSJ lors de la célèbre Fiesta Calor. À ce jour, son plus grand concert a été la Fiesta Del Sol 2024, où il a partagé la scène avec Airbag et Trueno devant 30 000 personnes, à seulement 17 ans. Il a conquis une grande partie du public de sa province en se produisant lors d'événements comme la Fiesta De Santa Lucía et la Fiesta De La Cerveza, et même à Buenos Aires avec deux dates à Local Support. Quelque temps après sa première sortie, il a présenté « ÉXTASIS », une chanson aux influences pop, EDM, D&B et trap, avec un clip qui a atteint 50 000 vues sur YouTube en peu de temps — dévoilé lors de son premier concert en tête d'affiche, où il est devenu le premier artiste de musique urbaine de San Juan à jouer accompagné d'un groupe, mêlant les genres avec le rock. Depuis, il continue de sortir des chansons, en maintenant un haut niveau de production musicale et visuelle, dans le but de faire grandir sa communauté.", "it": "Ekiss (@ekiss999) è un artista emergente di musica urbana originario della provincia di San Juan, Argentina. Fin da piccolo è stato molto vicino alla musica, influenzato dalla sua famiglia, il che lo ha portato in giovane età a comporre le proprie canzoni dalla sua camera. Pochi mesi dopo il suo primo lancio, con soli 15 anni, ha tenuto il suo show di debutto aprendo per Lucho SSJ alla rinomata Fiesta Calor. Ad oggi, il suo show più grande è stato la Fiesta Del Sol 2024, dove ha condiviso il palco con Airbag e Trueno davanti a 30.000 persone con soli 17 anni. Ha conquistato molto pubblico della sua provincia esibendosi in eventi come la Fiesta De Santa Lucía e la Fiesta De La Cerveza, e persino a Buenos Aires con due date al Local Support. Qualche tempo dopo il suo primo lancio, ha presentato \"ÉXTASIS\", una canzone con influenze pop, EDM, D&B e trap, con un videoclip che ha raggiunto le 50 mila visualizzazioni su YouTube in poco tempo — presentato in anteprima nel suo primo show da headliner, dove è diventato il primo artista di musica urbana di San Juan a suonare accompagnato da una band, mescolando generi con il rock. Da allora continua a pubblicare canzoni, mantenendo un alto standard di produzione musicale e visiva, con l'obiettivo di far crescere la sua community.", "de": "Ekiss (@ekiss999) ist ein aufstrebender Urban-Music-Künstler aus der Provinz San Juan, Argentinien. Schon von klein auf stand er der Musik sehr nahe, beeinflusst von seiner Familie, was ihn früh dazu brachte, seine eigenen Songs von seinem Zimmer aus zu schreiben. Nur wenige Monate nach seiner ersten Veröffentlichung, im Alter von nur 15 Jahren, gab er sein Debütkonzert als Vorgruppe für Lucho SSJ beim bekannten Fiesta Calor. Bis heute war sein größter Auftritt das Fiesta Del Sol 2024, wo er mit nur 17 Jahren gemeinsam mit Airbag und Trueno vor 30.000 Menschen auf der Bühne stand. Er begeisterte ein großes Publikum in seiner Heimatprovinz bei Events wie der Fiesta De Santa Lucía und der Fiesta De La Cerveza, sowie sogar in Buenos Aires mit zwei Terminen im Local Support. Einige Zeit nach seiner ersten Veröffentlichung präsentierte er \"ÉXTASIS\", einen Song mit Einflüssen aus Pop, EDM, D&B und Trap, mit einem Musikvideo, das in kurzer Zeit 50.000 Aufrufe auf YouTube erreichte — uraufgeführt bei seinem ersten Konzert als Headliner, bei dem er der erste Urban-Music-Künstler aus San Juan wurde, der mit einer Live-Band auftrat und dabei Genres mit Rock mischte. Seitdem veröffentlicht er weiterhin Songs und hält dabei einen hohen Standard bei musikalischer und visueller Produktion, mit dem Ziel, seine Community wachsen zu lassen.", "ru": "Ekiss (@ekiss999) — начинающий исполнитель урбан-музыки из провинции Сан-Хуан (San Juan), Аргентина. С детства он был тесно связан с музыкой благодаря влиянию семьи, что рано привело его к сочинению собственных песен прямо у себя в комнате. Через несколько месяцев после первого релиза, всего в 15 лет, он дал свой дебютный концерт на разогреве у Lucho SSJ на известном фестивале Fiesta Calor. На сегодняшний день его самым крупным выступлением стал Fiesta Del Sol 2024, где он в 17 лет вышел на сцену вместе с Airbag и Trueno перед 30 000 зрителей. Он покорил широкую публику своей провинции, выступая на таких мероприятиях, как Fiesta De Santa Lucía и Fiesta De La Cerveza, а также в Буэнос-Айресе — с двумя концертами в Local Support. Некоторое время спустя после первого релиза он представил «ÉXTASIS», песню с влиянием поп-музыки, EDM, D&B и трэпа, клип на которую быстро набрал 50 тысяч просмотров на YouTube — премьера состоялась на его первом сольном хедлайнерском концерте, где он стал первым исполнителем урбан-музыки из Сан-Хуана, выступившим с живой группой, смешав жанры с роком. С тех пор он продолжает выпускать песни, поддерживая высокий стандарт музыкального и визуального продакшена, с целью развивать свою аудиторию."}</script>
