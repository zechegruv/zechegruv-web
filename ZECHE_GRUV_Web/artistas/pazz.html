  <script type="application/json" id="bioData">{"es": "Juan Diego Molero Paz, conocido como Pazz, es un músico venezolano nacido en Maracaibo. Desde joven el arte fue su pasión, influenciado por una familia que lo introdujo a los instrumentos folclóricos de su región. Hace una década decidió dedicarse en serio a la música, iniciando una formación académica que refinó tanto su técnica como su creatividad. Tras colaborar en un proyecto musical en Venezuela, se trasladó a Buenos Aires en 2015 en busca de nuevas oportunidades, donde enfrentó desafíos personales y profesionales significativos. Su última canción, \"Se cae y se empieza\", coescrita con Yaco, celebra la fuerza para levantarse después de cada caída, con un mensaje de perseverancia y aprendizaje constante. Sus influencias musicales abarcan desde The Beatles hasta el folclore venezolano y la salsa, destacando a Jorge Drexler como una fuente de inspiración clave en su carrera.", "en": "Juan Diego Molero Paz, known as Pazz, is a Venezuelan musician born in Maracaibo. From a young age, art was his passion, influenced by a family that introduced him to the folk instruments of his region. A decade ago he decided to commit seriously to music, beginning an academic training that refined both his technique and his creativity. After collaborating on a musical project in Venezuela, he moved to Buenos Aires in 2015 in search of new opportunities, where he faced significant personal and professional challenges. His latest song, \"Se cae y se empieza\", co-written with Yaco, celebrates the strength to get back up after every fall, carrying a message of perseverance and constant learning. His musical influences range from The Beatles to Venezuelan folk music and salsa, with Jorge Drexler standing out as a key source of inspiration in his career.", "pt": "Juan Diego Molero Paz, conhecido como Pazz, é um músico venezuelano nascido em Maracaibo. Desde jovem, a arte foi sua paixão, influenciado por uma família que o introduziu aos instrumentos folclóricos de sua região. Há uma década decidiu se dedicar a sério à música, iniciando uma formação acadêmica que refinou tanto sua técnica quanto sua criatividade. Após colaborar em um projeto musical na Venezuela, mudou-se para Buenos Aires em 2015 em busca de novas oportunidades, onde enfrentou desafios pessoais e profissionais significativos. Sua última música, \"Se cae y se empieza\", coescrita com Yaco, celebra a força para se levantar depois de cada queda, com uma mensagem de perseverança e aprendizado constante. Suas influências musicais vão desde os The Beatles até o folclore venezuelano e a salsa, destacando-se Jorge Drexler como uma fonte de inspiração fundamental em sua carreira.", "fr": "Juan Diego Molero Paz, connu sous le nom de Pazz, est un musicien vénézuélien né à Maracaibo. Dès son plus jeune âge, l'art a été sa passion, influencé par une famille qui l'a initié aux instruments folkloriques de sa région. Il y a une décennie, il a décidé de se consacrer sérieusement à la musique, entamant une formation académique qui a affiné à la fois sa technique et sa créativité. Après avoir collaboré à un projet musical au Venezuela, il s'est installé à Buenos Aires en 2015 à la recherche de nouvelles opportunités, où il a dû faire face à des défis personnels et professionnels importants. Sa dernière chanson, « Se cae y se empieza », coécrite avec Yaco, célèbre la force de se relever après chaque chute, avec un message de persévérance et d'apprentissage constant. Ses influences musicales vont des Beatles au folklore vénézuélien et à la salsa, Jorge Drexler se distinguant comme une source d'inspiration clé dans sa carrière.", "it": "Juan Diego Molero Paz, noto come Pazz, è un musicista venezuelano nato a Maracaibo. Fin da giovane l'arte è stata la sua passione, influenzato da una famiglia che lo ha avvicinato agli strumenti folcloristici della sua regione. Un decennio fa ha deciso di dedicarsi seriamente alla musica, iniziando una formazione accademica che ha affinato sia la sua tecnica che la sua creatività. Dopo aver collaborato a un progetto musicale in Venezuela, si è trasferito a Buenos Aires nel 2015 in cerca di nuove opportunità, dove ha affrontato sfide personali e professionali significative. La sua ultima canzone, \"Se cae y se empieza\", scritta insieme a Yaco, celebra la forza di rialzarsi dopo ogni caduta, con un messaggio di perseveranza e apprendimento costante. Le sue influenze musicali spaziano dai The Beatles al folclore venezuelano e alla salsa, con Jorge Drexler come fonte d'ispirazione chiave nella sua carriera.", "de": "Juan Diego Molero Paz, bekannt als Pazz, ist ein venezolanischer Musiker, geboren in Maracaibo. Schon in jungen Jahren war die Kunst seine Leidenschaft, beeinflusst von einer Familie, die ihn mit den folkloristischen Instrumenten seiner Region vertraut machte. Vor einem Jahrzehnt beschloss er, sich ernsthaft der Musik zu widmen, und begann eine akademische Ausbildung, die sowohl seine Technik als auch seine Kreativität verfeinerte. Nach der Mitarbeit an einem Musikprojekt in Venezuela zog er 2015 auf der Suche nach neuen Möglichkeiten nach Buenos Aires, wo er bedeutenden persönlichen und beruflichen Herausforderungen begegnete. Sein neuester Song, \"Se cae y se empieza\", mitgeschrieben mit Yaco, feiert die Kraft, sich nach jedem Fall wieder aufzurichten, mit einer Botschaft von Beharrlichkeit und stetigem Lernen. Seine musikalischen Einflüsse reichen von den Beatles bis zur venezolanischen Folklore und Salsa, wobei Jorge Drexler als eine zentrale Inspirationsquelle in seiner Karriere hervorsticht.", "ru": "Хуан Диего Молеро Пас (Juan Diego Molero Paz), известный как Pazz, — венесуэльский музыкант, родившийся в Маракайбо. С юных лет искусство было его страстью благодаря семье, познакомившей его с народными инструментами своего региона. Десять лет назад он решил всерьёз посвятить себя музыке и начал академическое обучение, которое отточило его технику и творческий подход. После участия в музыкальном проекте в Венесуэле он переехал в Буэнос-Айрес в 2015 году в поисках новых возможностей, где столкнулся с серьёзными личными и профессиональными трудностями. Его последняя песня «Se cae y se empieza», написанная в соавторстве с Yaco, прославляет силу подниматься после каждого падения, неся послание об упорстве и постоянном обучении. Его музыкальные влияния простираются от The Beatles до венесуэльского фольклора и сальсы, а Хорхе Дрекслер (Jorge Drexler) выделяется как ключевой источник вдохновения в его карьере."}</script>
