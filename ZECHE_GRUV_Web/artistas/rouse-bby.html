  <script type="application/json" id="bioData">{"es": "Rouse Bby, cuyo nombre real es Romina Belén Colósimo, es una cantante y compositora de Buenos Aires que combina drill, trap y R&B con una impronta emocional y nocturna. Autodidacta, descubrió su vocación por la música en la escuela secundaria, cuando compuso su primer tema y adoptó el nombre artístico que la identifica hoy. En 2026 lanzó su primer EP, \"A.M.03\", producido junto a ZECHE GRUV y Martin Vegas, que fusiona trap y reggaetón en cuatro canciones centradas en la intensidad emocional de la madrugada. Previamente había presentado el sencillo \"UF!\", un giro hacia el drill producido por Gsamaniego y Kid Filly, con videoclip filmado en el centro porteño. Describe la música como una herramienta terapéutica y un espacio de sanación personal.", "en": "Rouse Bby, whose real name is Romina Belén Colósimo, is a singer and songwriter from Buenos Aires who blends drill, trap and R&B with an emotional, nocturnal touch. Self-taught, she discovered her passion for music in high school, when she wrote her first song and adopted the stage name that identifies her today. In 2026 she released her first EP, \"A.M.03\", produced together with ZECHE GRUV and Martin Vegas, which fuses trap and reggaetón across four songs centered on the emotional intensity of the early morning hours. She had previously released the single \"UF!\", a turn toward drill produced by Gsamaniego and Kid Filly, with a music video filmed in downtown Buenos Aires. She describes music as a therapeutic tool and a space for personal healing.", "pt": "Rouse Bby, cujo nome verdadeiro é Romina Belén Colósimo, é uma cantora e compositora de Buenos Aires que combina drill, trap e R&B com uma marca emocional e noturna. Autodidata, descobriu sua vocação pela música no ensino médio, quando compôs sua primeira música e adotou o nome artístico que a identifica hoje. Em 2026 lançou seu primeiro EP, \"A.M.03\", produzido junto com ZECHE GRUV e Martin Vegas, que funde trap e reggaeton em quatro faixas centradas na intensidade emocional da madrugada. Anteriormente havia lançado o single \"UF!\", uma guinada rumo ao drill produzida por Gsamaniego e Kid Filly, com videoclipe filmado no centro de Buenos Aires. Descreve a música como uma ferramenta terapêutica e um espaço de cura pessoal.", "fr": "Rouse Bby, de son vrai nom Romina Belén Colósimo, est une chanteuse et compositrice de Buenos Aires qui mêle drill, trap et R&B avec une touche émotionnelle et nocturne. Autodidacte, elle a découvert sa vocation pour la musique au lycée, lorsqu'elle a composé son premier titre et adopté le nom de scène qui la définit aujourd'hui. En 2026, elle a sorti son premier EP, « A.M.03 », produit avec ZECHE GRUV et Martin Vegas, qui fusionne trap et reggaeton sur quatre titres centrés sur l'intensité émotionnelle des petites heures du matin. Elle avait auparavant présenté le single « UF! », un virage vers le drill produit par Gsamaniego et Kid Filly, avec un clip tourné dans le centre de Buenos Aires. Elle décrit la musique comme un outil thérapeutique et un espace de guérison personnelle.", "it": "Rouse Bby, il cui vero nome è Romina Belén Colósimo, è una cantautrice di Buenos Aires che unisce drill, trap e R&B con un'impronta emotiva e notturna. Autodidatta, ha scoperto la sua vocazione per la musica alle superiori, quando ha composto il suo primo brano e ha adottato il nome d'arte che la identifica oggi. Nel 2026 ha pubblicato il suo primo EP, \"A.M.03\", prodotto insieme a ZECHE GRUV e Martin Vegas, che fonde trap e reggaeton in quattro brani incentrati sull'intensità emotiva delle prime ore del mattino. In precedenza aveva presentato il singolo \"UF!\", una svolta verso il drill prodotta da Gsamaniego e Kid Filly, con un videoclip girato nel centro di Buenos Aires. Descrive la musica come uno strumento terapeutico e uno spazio di guarigione personale.", "de": "Rouse Bby, mit bürgerlichem Namen Romina Belén Colósimo, ist eine Sängerin und Songwriterin aus Buenos Aires, die Drill, Trap und R&B mit einer emotionalen, nächtlichen Note verbindet. Autodidaktisch entdeckte sie ihre Leidenschaft für Musik in der Highschool, als sie ihren ersten Song schrieb und den Künstlernamen annahm, der sie heute identifiziert. 2026 veröffentlichte sie ihr erstes EP, \"A.M.03\", produziert gemeinsam mit ZECHE GRUV und Martin Vegas, das Trap und Reggaeton in vier Songs verschmilzt, die sich um die emotionale Intensität der frühen Morgenstunden drehen. Zuvor hatte sie die Single \"UF!\" veröffentlicht, eine Hinwendung zum Drill, produziert von Gsamaniego und Kid Filly, mit einem im Zentrum von Buenos Aires gedrehten Musikvideo. Sie beschreibt Musik als therapeutisches Werkzeug und Raum für persönliche Heilung.", "ru": "Rouse Bby, настоящее имя которой Ромина Белен Колосимо (Romina Belén Colósimo), — певица и автор песен из Буэнос-Айреса, сочетающая дрилл, трэп и R&B с эмоциональным, ночным настроением. Самоучка, она открыла в себе тягу к музыке ещё в старшей школе, когда написала свою первую песню и взяла сценическое имя, под которым известна сегодня. В 2026 году она выпустила свой первый EP «A.M.03», записанный вместе с ZECHE GRUV и Martin Vegas, — четыре песни, сочетающие трэп и реггетон и посвящённые эмоциональной напряжённости раннего утра. Ранее она представила сингл «UF!», поворот в сторону дрилла, спродюсированный Gsamaniego и Kid Filly, с клипом, снятым в центре Буэнос-Айреса. Она описывает музыку как терапевтический инструмент и пространство для личного исцеления."}</script>
